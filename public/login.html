<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Fingerprint System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1E40AF; --primary-dark: #1E3A8A; --primary-light: #3B82F6;
      --bg: #F1F5F9; --surface: #FFFFFF; --border: #E2E8F0;
      --text: #0F172A; --text-sub: #64748B; --text-muted: #94A3B8;
      --danger: #DC2626; --radius: 12px;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 40%, #1E40AF 70%, #1D4ED8 100%);
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: .25; z-index: 0; pointer-events: none;
      animation: float 12s ease-in-out infinite;
    }
    .bg-orb-1 { width: 500px; height: 500px; background: #3B82F6; top: -150px; left: -100px; animation-delay: 0s; }
    .bg-orb-2 { width: 400px; height: 400px; background: #7C3AED; bottom: -100px; right: -80px; animation-delay: 4s; }
    .bg-orb-3 { width: 300px; height: 300px; background: #06B6D4; top: 40%; left: 60%; animation-delay: 8s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -30px) scale(1.05); }
      66% { transform: translate(-15px, 20px) scale(0.95); }
    }

    /* Grid pattern overlay */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .login-wrapper {
      position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 20px;
    }

    /* Logo area */
    .login-logo {
      text-align: center; margin-bottom: 28px;
    }
    .logo-icon {
      width: 64px; height: 64px; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.15);
      border-radius: 18px; display: inline-flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); margin-bottom: 14px;
    }
    .logo-icon svg { width: 32px; height: 32px; }
    .login-logo h1 { color: white; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
    .login-logo p  { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 4px; }

    /* Card */
    .login-card {
      background: rgba(255,255,255,.97); border-radius: var(--radius);
      padding: 32px; box-shadow: 0 24px 64px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
    }
    .login-card h2 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .login-card p  { font-size: 13.5px; color: var(--text-sub); margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--text-muted);
    }
    .input-icon svg { width: 16px; height: 16px; }
    .form-control {
      width: 100%; padding: 11px 13px 11px 40px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: 'Inter', sans-serif; color: var(--text);
      background: white; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .form-control:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .form-control.error { border-color: var(--danger); }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;
    }
    .toggle-pw:hover { color: var(--text-sub); }
    .toggle-pw svg { width: 16px; height: 16px; }

    .error-msg {
      background: #FEF2F2; border: 1px solid #FECACA; border-radius: 8px;
      padding: 10px 14px; color: var(--danger); font-size: 13px; font-weight: 500;
      margin-bottom: 16px; display: none; align-items: center; gap: 8px;
    }
    .error-msg.show { display: flex; }
    .error-msg svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-login {
      width: 100%; padding: 12px; background: var(--primary); color: white;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;
    }
    .btn-login:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(30,64,175,.35); }
    .btn-login:active { transform: none; }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; }
    .btn-login svg { width: 18px; height: 18px; }

    .spinner-sm {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: white; border-radius: 50%; animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center; margin-top: 20px;
      color: rgba(255,255,255,.5); font-size: 12px;
    }
    .login-footer strong { color: rgba(255,255,255,.75); }

    /* Shake animation */
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }
    .shake { animation: shake .4s ease; }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="login-wrapper">
    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 4C11.2 4 7.2 7.2 6 11.6C7 11.2 8.2 11 9.4 11C12.2 11 14.8 12.4 16.4 14.6C17.4 13.6 18.8 13 20.4 13C22 13 23.4 13.6 24.4 14.6C25.6 13 26 11 25.8 9C24.4 6 20.4 4 16 4Z" fill="rgba(255,255,255,0.9)"/>
          <circle cx="16" cy="20" r="7" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none"/>
          <circle cx="16" cy="20" r="3" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
      <h1>Fingerprint System</h1>
      <p>Attendance Report v1.0</p>
    </div>

    <div class="login-card">
      <h2>Selamat Datang</h2>
      <p>Masukkan kredensial Anda untuk mengakses sistem</p>

      <div class="error-msg" id="error-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="error-text">Username atau password salah</span>
      </div>

      <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" onclick="togglePw()" id="pw-toggle">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="btn-icon"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10,17 15,12 10,7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Masuk ke Sistem
        </button>
      </form>
    </div>

    <div class="login-footer">
      <strong>Fingerprint Attendance System</strong><br/>
      Hikvision ISAPI Integration
    </div>
  </div>

  <script>
    // Cek sudah login?
    fetch('/api/me').then(r => { if (r.ok) location.href = '/'; });

    function togglePw() {
      const inp = document.getElementById('password');
      const ico = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        inp.type = 'password';
        ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    async function doLogin(e) {
      e.preventDefault();
      const btn  = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');
      const errTx = document.getElementById('error-text');
      const card  = document.querySelector('.login-card');

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner-sm"></div> Memverifikasi...';
      errEl.classList.remove('show');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><polyline points="20,6 9,17 4,12"/></svg> Berhasil!';
          btn.style.background = '#16A34A';
          setTimeout(() => location.href = '/', 600);
        } else {
          errTx.textContent = data.error || 'Username atau password salah';
          errEl.classList.add('show');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 400);
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10,17 15,12 10,7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Masuk ke Sistem';
        }
      } catch {
        errTx.textContent = 'Tidak dapat terhubung ke server';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Masuk ke Sistem';
      }
    }
  </script>
</body>
</html>
